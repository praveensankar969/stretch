<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A moment for you · Stretch</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <main class="player" aria-labelledby="ex-title">
      <header class="player-header">
        <a class="brand" aria-label="Stretch"
          ><span class="brand-mark" aria-hidden="true"></span
          ><span class="brand-word">Stretch</span></a
        >
        <div class="window-actions">
          <button
            id="expand-btn"
            class="icon-btn"
            aria-label="Expand to immersive view"
            title="Expand to immersive view"
          >
            ⛶</button
          ><button
            id="close-btn"
            class="icon-btn"
            aria-label="Close this break"
            title="Close this break"
          >
            ×
          </button>
        </div>
      </header>
      <div class="player-stage">
        <div class="stage-label">
          <span class="tag" id="exercise-position">Seated</span
          ><span class="tag" id="sequence-label">A MOMENT FOR YOU</span>
        </div>
        <div class="stage-circle" aria-hidden="true"></div>
        <div id="exercise-figure" class="figure"></div>
        <div class="stage-floor" aria-hidden="true"></div>
        <span class="stage-caption" id="camera-label"></span>
        <div class="camera-controls" role="group" aria-label="Animation view">
          <button
            type="button"
            data-view="guide"
            aria-pressed="true"
            title="Recommended angle for this movement"
          >
            Guide
          </button>
          <button type="button" data-view="front" aria-pressed="false">
            Front
          </button>
          <button type="button" data-view="side" aria-pressed="false">
            Side
          </button>
        </div>
      </div>
      <section class="player-copy">
        <div class="player-meta">
          <span class="eyebrow" id="region-label">YOUR DAILY RESET</span
          ><span id="progress-chip">0 / 6 today</span>
        </div>
        <h1 id="ex-title">A moment for you.</h1>
        <p id="ex-desc">Let’s make a little space.</p>
        <div class="cue-box">
          <span aria-hidden="true">✳</span>
          <p id="ex-cue">Keep it gentle. Breathe naturally.</p>
        </div>
        <div class="playback" id="playback">
          <div class="phase-row">
            <span id="phase-label" role="status">Ready when you are</span
            ><span id="timer">—</span>
          </div>
          <div
            class="timeline"
            role="progressbar"
            aria-label="Session progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="timeline-fill"></div>
          </div>
          <div class="playback-meta">
            <span id="rep-label">No rush. This is your time.</span
            ><span id="side-label"></span>
          </div>
        </div>
        <div class="player-actions">
          <button id="play-btn" class="btn primary">
            Let’s begin <span aria-hidden="true">→</span></button
          ><button id="snooze-btn" class="btn ghost">In 5 min</button>
        </div>
        <p id="player-message" role="status" class="player-message"></p>
        <footer class="player-footer">
          <button id="source-btn" class="linklike">Movement source ↗</button
          ><span>Stop if it hurts.</span>
        </footer>
        <p class="keyboard-hint">
          Space to pause · Esc to leave immersive view or close
        </p>
      </section>
    </main>
    <script src="shared/exercises.js"></script>
    <script src="shared/motion.js"></script>
    <script src="shared/session-clock.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
